name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Bei mehreren schnell aufeinanderfolgenden Pushes auf denselben Branch nur den neuesten Lauf
# behalten, ältere abbrechen.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify (ktlint, Detekt, Lint, Unit-Tests)
        run: ./gradlew check --continue --console=plain

      - name: Reports hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            app/build/reports/detekt/
            app/build/reports/ktlint/
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Der Firestore-Emulator ist ein Java-Programm.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Firestore-Regeln gegen den Emulator testen
        run: npm test
